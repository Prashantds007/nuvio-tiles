name: Build tiles

on:
  push:
    paths:
      - "tiles.json"
      - "make_tiles.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python make_tiles.py
      - name: Commit images
        run: |
          git config user.name "tiles-bot"
          git config user.email "tiles-bot@users.noreply.github.com"
          git add tiles logos
          git diff --cached --quiet || git commit -m "Build tile images"
          git push
